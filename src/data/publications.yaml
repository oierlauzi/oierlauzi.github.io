# Works with a Crossref DOI. This list is hand-owned and is the source of
# truth for *which* works are mine; `npm run sync:publications` fetches the
# metadata for each DOI and writes publications.generated.json.
#
# ORCID cannot do the discovering: it currently holds 1 of these 4, and
# Crossref's `filter=orcid:` returns nothing because no publisher deposited
# the ORCID. The sync reports that drift in both directions instead.

