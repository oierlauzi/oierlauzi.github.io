# REX is the umbrella; rexlib is its core library. The `rex` repository itself
# has no content yet, so rexlib carries the primary link.
name: REX
kind: independent
status: in-development
featured: true
period:
  start: '2024'
  end: null
summary:
  en: A scalable and extensible Cryo-EM image processing framework.
  es: Un marco escalable y extensible de procesado de imagen para Cryo-EM.
  eu: Cryo-EM-erako irudi-prozesaketa marko eskalagarri eta hedagarria.
tech: [C++, CUDA, Metal, Python]
primaryUrl: https://github.com/gigabit-clowns/rexlib
components:
  - name: rexlib
    url: https://github.com/gigabit-clowns/rexlib
    summary:
      en: Device-agnostic array computing library for Cryo-EM and Cryo-ET with a pluggable backend architecture.
      es: Biblioteca de cálculo con arrays para Cryo-EM y Cryo-ET multiplataforma, con arquitectura de backends intercambiables.
      eu: Cryo-EM eta Cryo-ET-rako array-kalkulu liburutegi modularra.
  - name: rexlib-cuda
    url: https://github.com/gigabit-clowns/rexlib-cuda
    summary:
      en: CUDA backend for rexlib.
      es: Backend CUDA para rexlib.
      eu: rexlib-erako CUDA backend-a.
  - name: rexlib-python
    url: https://github.com/gigabit-clowns/rexlib-python
    summary:
      en: Python bindings for rexlib.
      es: Enlaces de Python para rexlib.
      eu: rexlib-erako Python loturak.
