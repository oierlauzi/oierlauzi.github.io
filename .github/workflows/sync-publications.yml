name: Sync publication metadata

# Refreshes Crossref metadata and reconciles against ORCID. Opens a pull
# request only when the generated data actually changed, so a quiet month is
# genuinely quiet.

on:
  schedule:
    # 07:17 on the 1st of each month. An odd minute, because everything
    # scheduled on the hour competes for runners.
    - cron: '17 7 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Written outside the working tree so the report can never show up in the
      # pull request's diff.
      - name: Fetch Crossref metadata and reconcile against ORCID
        run: node scripts/sync-publications.ts | tee "$RUNNER_TEMP/sync-report.txt"

      # The sync writes Crossref metadata only; the ORCID reconciliation is a
      # report, not an output. A month where ORCID is simply missing papers
      # therefore changes no file and opens no PR — exactly the case the
      # reconciliation exists to surface. Putting it in the run summary means
      # every run leaves a visible note either way.
      #
      # Deliberately not a failure: a stale ORCID record is a thing to do, not
      # a broken build.
      - name: Publish reconciliation report
        if: always()
        run: |
          {
            echo '## Publications sync'
            echo
            echo '```'
            cat "$RUNNER_TEMP/sync-report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: peter-evans/create-pull-request@v8
        with:
          add-paths: src/data/publications.generated.json
          branch: chore/sync-publications
          delete-branch: true
          title: Update publication metadata from Crossref
          commit-message: |
            Update publication metadata from Crossref

            Generated by scripts/sync-publications.ts. Review the diff: this is
            upstream metadata changing, not an edit of yours.
          body: |
            Crossref metadata for one or more publications has changed since the
            last sync.

            This file is machine-written — check the diff rather than editing it.
            The ORCID reconciliation report for this run is in the workflow's
            summary.
