name: Deploy to GitHub Pages

# Requires Settings → Pages → Source: "GitHub Actions". Until that is switched,
# the repository still serves the old gh-pages branch and nothing here reaches
# the live site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let a running one finish rather than
# cancelling it half-way through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Astro 7 requires Node >= 22.23.4; .nvmrc is the single source of
          # truth so CI and local development cannot drift.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Before the build, deliberately: a missing Basque string should stop the
      # deploy rather than ship a half-English page. This is what the typed UI
      # dictionary and the localized() schema helper exist to catch.
      - name: Type-check and verify translation completeness
        run: npx astro check

      - run: npx astro build

      - name: Install Chromium for PDF generation
        run: npx playwright install --with-deps chromium

      # Writes the three CV PDFs into dist/, so they ship with the site.
      - run: npm run build:pdf

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
